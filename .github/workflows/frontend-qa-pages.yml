name: Frontend QA Pages

on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'

permissions:
  contents: read

concurrency:
  group: zero-explore-frontend-qa-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa-pages:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.18.1'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Run frontend QA pages
        run: npm run qa:pages

      - name: Upload frontend QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-qa-pages
          path: output/playwright/frontend-smoke
          if-no-files-found: warn
